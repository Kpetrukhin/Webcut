name: Build Web & Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        run: npm run lint

      - name: Build web bundle
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Capacitor Android project
        run: node scripts/prepare-android.mjs

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CutSync-debug.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CutSync-APK
          path: CutSync-debug.apk
          if-no-files-found: error
